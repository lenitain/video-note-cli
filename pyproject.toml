[project]
name = "video-note-cli"
version = "0.1.0"
description = "Turn videos into timestamped, illustrated Markdown notes from the Linux command line"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.2,<2",
    "sherpa-onnx>=1.13,<2",
    "sherpa-onnx-core>=1.13,<2",
    "openai>=1.68,<3",
    "numpy>=1.26",
    "av>=13,<17",
    "Pillow>=10,<13",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
video-note = "video_note.cli:main"

[dependency-groups]
# 测试跑在本机 venv 里：`uv run pytest`。
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.build-backend]
module-name = "video_note"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不装包也能直接跑：源码布局是 src/。
pythonpath = ["src", "scripts"]

[tool.ruff]
# upstream/ 是上游原样快照：它的风格不是本仓风格，而且只做三方合并的 base。
exclude = ["upstream"]
